name: Finalize Release

# Triggered when a release PR (label: `release`) merges into main. Creates the
# git tag at the merge commit and publishes a GitHub Release with the CHANGELOG
# section for this version.
#
# Tags created with GITHUB_TOKEN do not fire other workflows' `on: push` triggers
# (GitHub recursion guard). Docker publish is therefore chained explicitly via
# workflow_dispatch — which *is* allowed to start a new run from GITHUB_TOKEN.

permissions:
  contents: read

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-finalize

jobs:
  finalize:
    name: Tag and publish
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # dispatch Docker Multi-arch Build and Publish

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          printf 'version=%s\n' "${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PYEOF' > release_notes.md
          import os
          import re

          version = os.environ["VERSION"]
          with open("CHANGELOG.md", encoding="utf-8") as f:
              content = f.read()

          pattern = re.compile(
              rf"^## v?{re.escape(version)}\b[^\n]*\n(.*?)(?=\n## |\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(content)
          if match:
              print(match.group(1).strip())
          else:
              print(f"See `CHANGELOG.md` for v{version}.")
          PYEOF

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release create "v${VERSION}" \
            --target "${MERGE_SHA}" \
            --title "v${VERSION}" \
            --notes-file release_notes.md

      # GITHUB_TOKEN tag/release creation does not trigger on.push workflows.
      # Explicit workflow_dispatch is the supported way to chain Docker publish.
      - name: Trigger Docker image publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          # Run against the tag ref so github.ref_name is vX.Y.Z for image tags.
          gh workflow run "Docker Multi-arch Build and Publish" \
            --repo "${{ github.repository }}" \
            --ref "${tag}"
          echo "Dispatched Docker Multi-arch Build and Publish for ${tag}"