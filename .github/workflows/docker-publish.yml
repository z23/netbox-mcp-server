name: Docker Multi-arch Build and Publish

# Prefer the tag-push trigger when the tag is created outside Actions (or with a
# PAT). When Finalize Release creates the tag with GITHUB_TOKEN, it cannot fire
# on.push — that workflow dispatches this one with --ref vX.Y.Z instead.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      # Optional override; normally leave empty and dispatch with --ref vX.Y.Z
      # so github.ref_name is already the tag.
      version:
        description: "Version without leading v (e.g. 1.3.0). Leave empty to use the ref name."
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: docker.io
  # Defaults to this repository (e.g. z23/netbox-mcp-server). Override via repo variable if needed.
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME || github.repository }}

jobs:
  # Nothing else in this repo gated publication on tests, so a tag on a commit
  # with a failing suite could ship as :latest. Run the same suite against the
  # exact tagged commit rather than trusting a check-run from an earlier push.
  test:
    name: Tests
    uses: ./.github/workflows/test.yml

  build:
    name: Build (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Published tags are immutable in practice: :latest, :MAJOR and :MAJOR.MINOR
      # are moved by every stable publish, and :X.Y.Z is cosign-signed and
      # attested. Without this guard, `--ref main -f version=1.3.0` passes the
      # shape check below, builds main HEAD, and silently replaces the contents of
      # an already-released, signed tag. Refuse anything that is not the tag itself.
      - name: Verify the ref is the release tag
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${REF_TYPE}" != "tag" ]; then
            echo "::error::Refusing to publish from ${REF_TYPE} '${REF_NAME}'."
            echo "Images are published only from a vX.Y.Z tag. Re-dispatch with --ref vX.Y.Z."
            exit 1
          fi
          if [ -n "${INPUT_VERSION}" ] && [ "v${INPUT_VERSION#v}" != "${REF_NAME}" ]; then
            echo "::error::inputs.version='${INPUT_VERSION}' does not match ref '${REF_NAME}'."
            echo "Omit inputs.version, or pass the version of the tag being published."
            exit 1
          fi
          version="${REF_NAME#v}"
          # Same strict shape check the merge job applies, repeated here so an
          # invalid version fails before any layer is pushed by digest.
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '${REF_NAME}' is not semver; expected vX.Y.Z or vX.Y.Z-prerelease."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${version} from tag ${REF_NAME}."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Stamp the OCI version/revision labels so the published image is
          # traceable back to the tag and commit it was built from.
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute version tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${REF_NAME#v}"
          fi
          # Strict semver: X.Y.Z optionally followed by a '-' prerelease. The
          # previous ([.-].*)? also admitted a 4th dotted component, so
          # '1.4.0.dev1' passed and then — having no '-' — was classified stable
          # by the case below and would have moved :latest.
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Ref/version '${version}' is not a semver tag; aborting."
            echo "Expected X.Y.Z or X.Y.Z-prerelease (e.g. 1.3.0, 1.3.0-rc1)."
            exit 1
          fi
          major="${version%%.*}"
          minor_part="${version#*.}"
          major_minor="${major}.${minor_part%%.*}"
          # Pre-release tags (containing `-`, e.g. v1.2.0-rc1) only stamp
          # the full version. They never move :latest, :MAJOR, or :MAJOR.MINOR.
          case "$version" in
            *-*) is_prerelease=true ;;
            *)   is_prerelease=false ;;
          esac
          {
            echo "version=${version}"
            echo "major=${major}"
            echo "major_minor=${major_minor}"
            echo "is_prerelease=${is_prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.tags.outputs.version }}
          MAJOR: ${{ steps.tags.outputs.major }}
          MAJOR_MINOR: ${{ steps.tags.outputs.major_minor }}
          IS_PRERELEASE: ${{ steps.tags.outputs.is_prerelease }}
        run: |
          sources=()
          for digest_file in *; do
            sources+=("${IMAGE}@sha256:${digest_file}")
          done
          tag_args=(--tag "${IMAGE}:${VERSION}")
          if [ "${IS_PRERELEASE}" = "false" ]; then
            tag_args+=(--tag "${IMAGE}:latest")
            tag_args+=(--tag "${IMAGE}:${MAJOR_MINOR}")
            tag_args+=(--tag "${IMAGE}:${MAJOR}")
          fi
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Capture manifest digest
        id: digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published manifest with cosign (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Inspect published manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
